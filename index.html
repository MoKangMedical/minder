<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>念念 - 你的第二记忆</title>
    <meta name="description" content="AI陪伴记忆平台——让思念的人永远在身边">
    <meta property="og:title" content="Minder">
    <meta property="og:description" content="AI陪伴记忆平台——让思念的人永远在身边">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/MoKangMedical/minder">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">

    <link rel="stylesheet" href="css/entrance.css">
</head>
<body>
    <!-- 梦幻入口页面 -->
    <div id="entrance" class="entrance">
        <!-- 星空背景 -->
        <div class="starry-sky">
            <div class="stars"></div>
            <div class="shooting-star"></div>
            <div class="shooting-star"></div>
            <div class="shooting-star"></div>
        </div>
        
        <!-- 极光 -->
        <div class="aurora">
            <div class="aurora-band"></div>
            <div class="aurora-band"></div>
            <div class="aurora-band"></div>
        </div>
        
        <!-- 月亮 -->
        <div class="moon">
            <div class="moon-glow"></div>
            <div class="moon-surface"></div>
        </div>
        
        <!-- 远山 -->
        <div class="mountains">
            <div class="mountain mountain-1"></div>
            <div class="mountain mountain-2"></div>
            <div class="mountain mountain-3"></div>
        </div>
        
        <!-- 森林背景 -->
        <div class="forest-bg">
            <div class="tree tree-1"></div>
            <div class="tree tree-2"></div>
            <div class="tree tree-3"></div>
            <div class="tree tree-4"></div>
            <div class="tree tree-5"></div>
        </div>
        
        <!-- 发光植物 -->
        <div class="glowing-plants">
            <div class="plant plant-1"></div>
            <div class="plant plant-2"></div>
            <div class="plant plant-3"></div>
            <div class="plant plant-4"></div>
        </div>
        
        <!-- 树洞入口 -->
        <div class="treehole-container">
            <div class="treehole-wrapper" onclick="enterDream()">
                <!-- 大树 -->
                <div class="big-tree">
                    <div class="tree-trunk">
                        <!-- 树纹理 -->
                        <div class="bark-texture"></div>
                    </div>
                    <div class="tree-crown"></div>
                </div>
                
                <!-- 树洞 -->
                <div class="treehole">
                    <div class="hole-inner">
                        <!-- 漩涡 -->
                        <div class="vortex">
                            <div class="vortex-ring"></div>
                            <div class="vortex-ring"></div>
                            <div class="vortex-ring"></div>
                            <div class="vortex-ring"></div>
                        </div>
                        
                        <!-- 星光 -->
                        <div class="hole-stars">
                            <div class="hole-star"></div>
                            <div class="hole-star"></div>
                            <div class="hole-star"></div>
                            <div class="hole-star"></div>
                            <div class="hole-star"></div>
                        </div>
                    </div>
                    
                    <!-- 树洞边框发光 -->
                    <div class="hole-glow"></div>
                </div>
                
                <!-- 萤火虫 -->
                <div class="fireflies">
                    <div class="firefly"></div>
                    <div class="firefly"></div>
                    <div class="firefly"></div>
                    <div class="firefly"></div>
                    <div class="firefly"></div>
                    <div class="firefly"></div>
                </div>
            </div>
            
            <!-- 点击提示 -->
            <div class="enter-hint">
                <div class="hint-text">轻触树洞，进入梦境</div>
                <div class="hint-arrow"></div>
            </div>
        </div>
        
        <!-- 前景草丛 -->
        <div class="foreground-grass">
            <div class="grass-tuft tuft-1"></div>
            <div class="grass-tuft tuft-2"></div>
            <div class="grass-tuft tuft-3"></div>
            <div class="grass-tuft tuft-4"></div>
            <div class="grass-tuft tuft-5"></div>
        </div>
        
        <!-- 迷雾 -->
        <div class="mist">
            <div class="mist-layer"></div>
            <div class="mist-layer"></div>
        </div>
        
        <!-- 品牌 -->
        <div class="brand">
            <div class="brand-butterfly">🦋</div>
            <div class="brand-name">念念</div>
            <div class="brand-slogan">一念既起，皆为序章</div>
        </div>
        
        <!-- 粒子效果 -->
        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>
    
    <!-- 过渡动画 -->
    <div id="transition" class="transition hidden">
        <div class="transition-vortex"></div>
        <div class="transition-text">正在进入梦境...</div>
    </div>
    
    <script>
        // 进入梦境
        function enterDream() {
            const entrance = document.getElementById('entrance');
            const transition = document.getElementById('transition');
            const treehole = document.querySelector('.treehole-wrapper');
            
            // 点击音效（可选）
            // playClickSound();
            
            // 树洞放大动画
            treehole.style.transform = 'scale(1.5)';
            treehole.style.transition = 'transform 1s ease-in';
            
            // 显示过渡动画
            setTimeout(() => {
                transition.classList.remove('hidden');
                
                // 漩涡旋转加速
                const vortex = document.querySelector('.transition-vortex');
                vortex.style.animation = 'vortexSpin 0.5s linear infinite';
                
                // 3秒后跳转到主应用
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 2000);
            }, 800);
        }
        
        // 萤火虫随机飞行
        function animateFireflies() {
            const fireflies = document.querySelectorAll('.firefly');
            
            fireflies.forEach((fly, index) => {
                setInterval(() => {
                    const x = (Math.random() - 0.5) * 100;
                    const y = (Math.random() - 0.5) * 50;
                    const duration = 3 + Math.random() * 2;
                    
                    fly.style.transition = `transform ${duration}s ease-in-out`;
                    fly.style.transform = `translate(${x}px, ${y}px)`;
                }, 3000 + index * 500);
            });
        }
        
        // 启动萤火虫动画
        setTimeout(animateFireflies, 1000);
        
        // 鼠标/触摸视差效果
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth - 0.5;
            const y = e.clientY / window.innerHeight - 0.5;
            
            // 树洞轻微移动
            const treehole = document.querySelector('.treehole-container');
            treehole.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            
            // 远山移动
            const mountains = document.querySelector('.mountains');
            mountains.style.transform = `translateX(${x * 20}px)`;
            
            // 森林移动
            const forest = document.querySelector('.forest-bg');
            forest.style.transform = `translateX(${x * 10}px)`;
        });
        
        // 点击树洞时的涟漪效果
        document.querySelector('.treehole-wrapper').addEventListener('click', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'treehole-ripple';
            ripple.style.cssText = `
                position: absolute;
                width: 100px;
                height: 100px;
                background: radial-gradient(circle, rgba(224,195,252,0.6) 0%, transparent 70%);
                border-radius: 50%;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) scale(0);
                animation: rippleExpand 0.8s ease-out forwards;
                pointer-events: none;
            `;
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        });
        
        // 添加涟漪动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleExpand {
                to {
                    transform: translate(-50%, -50%) scale(3);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
